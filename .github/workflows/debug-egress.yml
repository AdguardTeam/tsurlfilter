name: Debug egress (temporary)

# Temporary diagnostics for the git ls-remote 401 failures on team-extensions
# runners. DELETE BEFORE MERGE.

on:
  pull_request:

permissions:
  contents: read

jobs:
  egress:
    name: Probe github.com git egress
    runs-on: team-extensions
    timeout-minutes: 15
    steps:
      - name: Runner host environment
        run: |
          echo "=== proxy env:"; env | grep -iE 'proxy|http_|https_' || echo 'none'
          echo "=== git config (proxy/credential/url):"; git config --list --show-origin | grep -iE 'proxy|credential|insteadof' || echo 'none'
          echo "=== egress IP:"; curl -s --max-time 10 https://ifconfig.me || echo 'ifconfig.me unreachable'; echo

      - name: ls-remote from the runner host
        run: |
          GIT_CURL_VERBOSE=1 git ls-remote https://github.com/AdguardTeam/text-encoding.git v0.7.2 2>&1 | grep -E '^< HTTP|Authentication|realm|refs/tags' || true
          git ls-remote https://github.com/AdguardTeam/text-encoding.git v0.7.2

      - name: ls-remote inside docker run (runner-local daemon)
        run: |
          docker run --rm adguard/node-ssh:22.22--0 git ls-remote https://github.com/AdguardTeam/text-encoding.git v0.7.2

      - name: ls-remote via docker build (BuildKit builder)
        run: |
          printf 'FROM adguard/node-ssh:22.22--0\nRUN git ls-remote https://github.com/AdguardTeam/text-encoding.git v0.7.2\n' > /tmp/egress.df
          docker buildx build --progress plain --no-cache -f /tmp/egress.df /tmp
