name: DevEx bridge

# Publishes the six tsurlfilter packages consumed by the browser extension to
# the internal Artifact Keeper npm registry with PR-scoped dev versions
# (<next-patch>-dev.pr<N>), republished (overwritten via unpublish+publish) on
# every push, and posts/updates a comment on the source PR explaining how to
# pin them into a browser-extension branch (scripts/use-dev-builds.mjs).
# The extension-side PR is deliberately created by the developer, not by CI.
# devex-bridge-cleanup.yml deletes the dev versions when the source PR closes.
#
# Trust boundary (read before enabling): `pull_request` executes this workflow
# from the PR's merge commit, and GitHub provisions org secrets to same-repo PR
# runs — so the ARTIFACT_KEEPER_API_KEY reaches code (inline node/bash in the
# unpublish/publish steps) that any same-repo member who can push here controls.
# Fork PRs get no secrets and the secret-touching jobs are additionally gated
# to same-repo PRs, but that does not protect against a same-repo insider. This
# matches the org model used by build.yml: the repo MUST require approval for
# fork / outside-collaborator PR runs, and .github/CODEOWNERS requires
# extensions-maintainers review of this workflow, its cleanup twin, and the
# pinning tool. The jobs touching the secret run fixed npm CLI calls / inline
# node scripts from this file; they never execute PR source code.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Each push republishes the same versions; stale runs are cancelled. This also
# serializes unpublish/publish so two runs of the same PR cannot interleave.
concurrency:
  group: devex-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The six packages the browser extension consumes, published as an
  # indivisible set: cross-package workspace:^ deps are rewritten to the
  # stamped dev versions at pack time, so all six must exist with the SAME
  # suffix for the set to resolve. This list is duplicated on purpose — it must
  # exist as an env in devex-bridge.yml and devex-bridge-cleanup.yml, in the
  # pack/publish matrices below, and in use-dev-builds.mjs — and every copy is
  # guarded against drift by scripts/ci/check-package-lists.mjs.
  BRIDGED_PACKAGES: 'logger css-tokenizer agtree tsurlfilter dnr-rulesets tswebextension'
  VERSION_SUFFIX: 'pr${{ github.event.pull_request.number }}'
  AK_REGISTRY: ${{ vars.ARTIFACT_KEEPER_URL }}/npm/npm-internal

jobs:
  changes:
    name: Detect affected packages
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      bridge-needed: ${{ steps.gate.outputs.bridge-needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute affected packages
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/compute-affected-packages.mjs

      - name: Decide whether bridging is needed
        id: gate
        run: |
          node -e "
            const matrix = JSON.parse(process.env.MATRIX);
            const bridged = process.env.BRIDGED_PACKAGES.split(' ');
            const targets = (matrix.include ?? []).map((e) => e.target);
            const hit = bridged.some((p) => targets.includes(p));
            const needed = process.env.ROOT_AFFECTED === 'true' || hit;
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, \`bridge-needed=\${needed}\n\`);
          "
        env:
          MATRIX: ${{ steps.affected.outputs.matrix }}
          ROOT_AFFECTED: ${{ steps.affected.outputs.root-affected }}

  pack:
    name: Pack ${{ matrix.package }}
    needs: changes
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # Cap concurrent Docker builds: the shared remote BuildKit builder OOMs /
      # drops connections under heavy parallelism (same rationale as build.yml).
      max-parallel: 4
      matrix:
        package: [logger, css-tokenizer, agtree, tsurlfilter, dnr-rulesets, tswebextension]
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject development package versions
        uses: AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@master
        with:
          package-globs: packages/*/package.json
          version-suffix: ${{ env.VERSION_SUFFIX }}

      # set-dev-version@master now honors `version-suffix` (ext-shared-actions#15),
      # so it stamps <next-patch>-dev.pr<N> directly and this step is a no-op. It
      # stays as an idempotent safety net for the gap between that action landing
      # and this repo running against it: a bare <next-patch>-dev stamp gets the
      # suffix appended on a later push. A wrong suffix (e.g. an empty
      # VERSION_SUFFIX) is caught by the "Verify tarball contents" step below.
      - name: Ensure PR dev-version suffix
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const dir of process.env.BRIDGED_PACKAGES.split(' ')) {
              const file = `packages/${dir}/package.json`;
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              const stamped = `-dev.${process.env.VERSION_SUFFIX}`;
              if (!pkg.version.endsWith(stamped)) {
                  pkg.version = `${pkg.version}.${process.env.VERSION_SUFFIX}`;
                  fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
              }
          }
          NODE

      - name: Build package tarball
        uses: ./.github/actions/docker-build
        with:
          target: build-${{ matrix.package }}-output
          dest: build-output

      # Same contract as _publish-release-monorepo.yml (scripts/ci/verify-tarball.sh):
      # a missing or mismatched tarball must fail here, not at publish time. The
      # script uses extraction-based checks (tar -xOf), NOT `tar -tzf | grep -q`:
      # under set -o pipefail that pipeline is racy — grep -q exits on the first
      # match, GNU tar dies of SIGPIPE ("tar: stdout: write error"), and pipefail
      # propagates the producer's failure as a false "package.json missing" error.
      # VERSION_SUFFIX is a workflow-level env var, so it is a plain environment
      # variable in the step shell; its value is built from the numeric PR number
      # only — no injection surface.
      - name: Verify tarball contents
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          TGZ="build-output/artifacts/${PACKAGE}.tgz"
          EXPECTED="$(node -p "require('./packages/${PACKAGE}/package.json').version")"
          if ! bash scripts/ci/verify-tarball.sh "${TGZ}" "${EXPECTED}"; then
            # verify-tarball.sh emits its ::error:: to stderr, which GitHub does
            # not render as an annotation; re-surface it on stdout here.
            echo "::error::${TGZ} failed verification (expected version ${EXPECTED}) — see output above"
            exit 1
          fi
          PACKED_VERSION="$(tar -xOf "${TGZ}" package/package.json | node -e "let json = ''; process.stdin.on('data', (d) => json += d).on('end', () => process.stdout.write(JSON.parse(json).version))")"
          case "${PACKED_VERSION}" in
            *-dev.${VERSION_SUFFIX}) ;;
            *) echo "::error::${TGZ} version ${PACKED_VERSION} does not end with -dev.${VERSION_SUFFIX}"; exit 1 ;;
          esac

      # Record the ACTUAL stamped version. This is the single source of the
      # dev-version map consumed by collect-versions/comment: no version
      # arithmetic is duplicated anywhere in the workflow, so what gets
      # advertised (and, via suffix scan, unpublished) is exactly what was
      # packed — it cannot drift from set-dev-version.
      - name: Record packed version
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync(\`packages/\${process.env.PACKAGE}/package.json\`, 'utf8'));
            fs.writeFileSync(\`\${process.env.PACKAGE}.json\`, JSON.stringify({ name: pkg.name, version: pkg.version }) + '\n');
          "

      - name: Upload version record
        uses: actions/upload-artifact@v7
        with:
          name: devex-version-${{ matrix.package }}
          path: ${{ matrix.package }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload dev package
        uses: actions/upload-artifact@v7
        with:
          name: devex-${{ matrix.package }}
          path: build-output/artifacts/${{ matrix.package }}.tgz
          if-no-files-found: error
          retention-days: 1

  collect-versions:
    name: Collect packed dev versions
    needs: [changes, pack]
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.versions.outputs.map }}
    steps:
      - name: Download version records
        uses: actions/download-artifact@v8
        with:
          pattern: devex-version-*
          path: versions
          merge-multiple: true

      - name: Emit packed versions map
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const records = fs.readdirSync('versions').filter((f) => f.endsWith('.json')).sort();
          const map = {};
          for (const file of records) {
              const record = JSON.parse(fs.readFileSync(`versions/${file}`, 'utf8'));
              if (!record.name || typeof record.version !== 'string') {
                  console.error(`::error::version record ${file} is malformed: ${JSON.stringify(record)}`);
                  process.exit(1);
              }
              map[record.name] = record.version;
          }
          const expected = process.env.BRIDGED_PACKAGES.split(' ').map((p) => `@adguard/${p}`);
          const missing = expected.filter((name) => !(name in map));
          if (missing.length > 0) {
              console.error(`::error::missing packed version records for: ${missing.join(', ')}`);
              process.exit(1);
          }
          console.log(`map=${JSON.stringify(map)}`);
          NODE

  unpublish:
    name: Unpublish previous dev versions (overwrite)
    # Only delete the previous dev builds AFTER the replacement tarballs for
    # this push are built and verified (pack mediates collect-versions), so a
    # failed build degrades to the previous builds still being present, never
    # leaves the PR with no dev builds at all.
    needs: [changes, pack]
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      # If the PR was closed/merged while this run was queued or running, bail
      # out — publishing over a closed PR re-creates versions that the
      # (single-fire, already-run) cleanup workflow can no longer delete, so a
      # late publish would leak permanent AK orphans.
      - name: Bail if the PR is no longer open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.event.pull_request.url }}" \
            | node -e "let d='';process.stdin.on('data',(c)=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).state||''))")"
          if [ "${state}" != "open" ]; then
            echo "::warning::PR #${{ github.event.pull_request.number }} is '${state}'; skipping AK unpublish (cleanup handles removal)"
            exit 0
          fi

      # Overwrite semantics: delete every -dev.pr<N> version currently on AK for
      # a bridged package (suffix scan — a mid-PR release bump may have left a
      # stale -dev.pr<N> behind) so the publish below lands the fresh tarball at
      # the same version. A missing package on the first push is normal; a
      # failed delete is NOT and fails the job loudly so we never advertise a
      # stale build as current.
      #
      # npm unpublish must pass --force: a single-version package on AK carries
      # BOTH the devex and the latest dist-tags, and npm refuses to delete a
      # version that still holds the latest tag ("Refusing to delete the latest
      # tag(s)"). Without --force the unpublish silently did nothing and the
      # republish then failed with 409 Conflict.
      - name: Unpublish existing dev versions by suffix
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          SUFFIX: '-dev.pr${{ github.event.pull_request.number }}'
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          failures=0
          for pkg in ${BRIDGED_PACKAGES}; do
            name="@adguard/${pkg}"
            if ! raw="$(npm view "${name}" versions --json --registry="${AK_REGISTRY}" --silent 2>&1)"; then
              if grep -qiE '404|not found|E404|EUNPUBLISH' <<<"${raw}"; then
                echo "${name}: not present on AK — nothing to unpublish (first push?)"
                continue
              fi
              echo "::error::Could not query ${name} on AK:"
              printf '%s\n' "${raw}"
              exit 1
            fi
            to_delete="$(node -e "
              const raw = JSON.parse(process.argv[1]);
              const list = Array.isArray(raw) ? raw : [raw];
              // endsWith: '-dev.pr1' must not match '-dev.pr12'.
              process.stdout.write(list.filter((v) => v.endsWith(process.env.SUFFIX)).join('\n'));
            " "${raw}")"
            [ -n "${to_delete}" ] || { echo "${name}: no previous dev versions for this PR"; continue; }
            while IFS= read -r version; do
              [ -n "${version}" ] || continue
              echo "Unpublishing previous ${name}@${version}"
              if out="$(npm unpublish "${name}@${version}" --force --registry="${AK_REGISTRY}" 2>&1)"; then
                continue
              fi
              if [[ "${out}" == *"405"* ]]; then
                echo "${name}@${version}: AK does not allow unpublish (405; idempotent publish gate handles re-pushes)"
              elif grep -qiE '404|not found|E404|EUNPUBLISH' <<<"${out}"; then
                echo "${name}@${version}: already absent — nothing to unpublish"
              else
                echo "::error::${name}@${version}: npm unpublish failed:"
                printf '%s\n' "${out}"
                failures=$((failures + 1))
              fi
            done <<< "${to_delete}"
          done
          if [ "${failures}" -gt 0 ]; then
            echo "::error::${failures} previous dev version(s) could not be unpublished — AK may still hold stale builds"
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.package }} to Artifact Keeper
    needs: [changes, pack, collect-versions, unpublish]
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        package: [logger, css-tokenizer, agtree, tsurlfilter, dnr-rulesets, tswebextension]
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      # Same bail-out as unpublish (A5): never publish after the PR closed.
      - name: Bail if the PR is no longer open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.event.pull_request.url }}" \
            | node -e "let d='';process.stdin.on('data',(c)=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).state||''))")"
          if [ "${state}" != "open" ]; then
            echo "::warning::PR #${{ github.event.pull_request.number }} is '${state}'; skipping AK publish"
            exit 0
          fi

      - name: Download dev package
        uses: actions/download-artifact@v8
        with:
          name: devex-${{ matrix.package }}
          path: .

      # AK versions are immutable: npm publish rejects an already-published
      # version with 409 (unpublish is blocked too — 405 on DELETE). A
      # -dev.pr<N> version only changes when the package's CHANGELOG is bumped
      # in this PR, so "already published at this exact version" means the dev
      # build is current — treat it as a no-op rather than a failure. Real
      # publish errors still fail the job loudly.
      - name: Publish to Artifact Keeper (skip if already published)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          PACKAGE_FILE: ${{ matrix.package }}.tgz
          TAG: devex
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          # Auth comes from NODE_AUTH_TOKEN + the .npmrc written by setup-node,
          # so no explicit --registry here (matches deploy-to-ak-npm.yml).
          if out="$(npm publish "${PACKAGE_FILE}" --access public --tag "${TAG}" 2>&1)"; then
              echo "Published ${PACKAGE_FILE} (tag ${TAG})"
          elif grep -qE '\bE409\b|409 Conflict|already exists' <<<"${out}"; then
              echo "::warning::${PACKAGE_FILE}: already published on AK — immutable versions are not overwritten, skipping"
          else
              echo "::error::npm publish failed for ${PACKAGE_FILE}:"
              printf '%s\n' "${out}"
              exit 1
          fi

  comment:
    name: Post usage comment on the source PR
    needs: [changes, publish, collect-versions]
    # publish is gated transitively via pack/unpublish; the explicit same-repo
    # guard keeps pull-requests: write scoped even if the gating chain changes.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A PR "comment" is an issue comment, and this repository has the Issues
      # feature disabled — GITHUB_TOKEN cannot hit /issues/*/comments there
      # (403 "Resource not accessible by integration"). Posting a pull-request
      # review (event: COMMENT) uses the pull-requests resource instead and
      # works regardless. Reviews are immutable, so upsert = update the body of
      # the review carrying our marker. listReviews is paginated so a busy PR
      # can never produce a duplicate.
      - name: Upsert dev-builds review
        uses: actions/github-script@v8
        env:
          MAP: ${{ needs.collect-versions.outputs.versions }}
          AK_REGISTRY: ${{ env.AK_REGISTRY }}
        with:
          script: |
            const marker = '<!-- devex-bridge -->';
            const pr = context.payload.pull_request.number;
            const map = JSON.parse(process.env.MAP);
            const rows = Object.entries(map)
                .map(([name, version]) => `| \`${name}\` | \`${version}\` |`)
                .join('\n');
            const body = [
                marker,
                '**Dev builds published** to the internal Artifact Keeper registry (overwritten on every push to this PR):',
                '',
                '| package | version |',
                '| --- | --- |',
                rows,
                '',
                'To build the browser extension against them, create your branch in `AdGuardSoftwareLimited/browser-extension` as usual, then pin the dev builds from an up-to-date tsurlfilter checkout:',
                '',
                '```bash',
                `node scripts/use-dev-builds.mjs --pr ${pr} --registry ${process.env.AK_REGISTRY} --extension /path/to/browser-extension`,
                '```',
                '',
                'Re-run the same command after every push to this PR (the dev builds are overwritten in place and the lockfile integrity is refreshed).',
                'These versions are deleted automatically when this PR is closed or merged.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: pr, per_page: 100 },
            );
            const existing = reviews.find((r) => r.body?.includes(marker));
            if (existing) {
                if (existing.body !== body) {
                    await github.rest.pulls.updateReview({
                        owner, repo, pull_number: pr, review_id: existing.id, body,
                    });
                }
            } else {
                await github.rest.pulls.createReview({
                    owner, repo, pull_number: pr, event: 'COMMENT', body,
                });
            }

  notify-failure:
    name: Notify bridge failure
    needs: [changes, pack, collect-versions, unpublish, publish, comment]
    # Bridge failures would otherwise only be visible on the PR checks.
    if: >-
      failure() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':x: *devex-bridge* failed for PR #${{ github.event.pull_request.number }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>'
          color: danger
