name: DevEx bridge

# Publishes the six tsurlfilter packages consumed by the browser extension to
# the internal Artifact Keeper npm registry with PR-scoped dev versions
# (<next-patch>-dev.pr<N>). AK versions are IMMUTABLE: a version is published
# once and cannot be overwritten or (per AK policy, HTTP 405) reliably
# unpublished in place. A re-push therefore re-publishes only when this PR
# bumps a package's CHANGELOG (so next-patch changes); otherwise the same
# version already on AK is left as-is and the published comment/docs tell the
# developer to re-run use-dev-builds to refresh the lockfile integrity, not to
# expect a new tarball. devex-bridge-cleanup.yml deletes the dev versions when
# the source PR closes; ak-dev-unpublish.sh is the single place the registry
# error taxonomy (404/405/other) lives.
# The extension-side PR is deliberately created by the developer, not by CI.
#
# Trust boundary (read before enabling): `pull_request` executes this workflow
# from the PR's merge commit, and GitHub provisions org secrets to same-repo PR
# runs — so the ARTIFACT_KEEPER_API_KEY reaches code (inline node/bash in this
# file and the reviewed scripts/ci/{check-pr-open,ak-dev-unpublish}.sh helpers)
# that any same-repo member who can push here controls. Fork PRs get no secrets
# and the secret-touching jobs are additionally gated to same-repo PRs, but that
# does not protect against a same-repo insider. This matches the org model used
# by build.yml: the repo MUST require approval for fork / outside-collaborator
# PR runs, and .github/CODEOWNERS requires extensions-maintainers review of this
# workflow, its cleanup twin, the pinning tool and the shared scripts. The jobs
# touching the secret run npm CLI calls / inline node / the small reviewed
# helper scripts; they never build or execute PR package code.
#
# Load note: `pack` caps its Docker build matrix at max-parallel 4; build.yml's
# `test` matrix runs 4 concurrent builds against the same shared BuildKit
# builder. The per-workflow cap does NOT cap the combined load (~8 during a
# synchronize). Built deliberately to keep both CIs snappy; the shared builder
# back-pressure absorbs short spikes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Each push re-evaluates the same PR; stale runs are cancelled. This also
# serializes publish/unpublish so two runs of the same PR cannot interleave.
concurrency:
  group: devex-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The six packages the browser extension consumes, published as an
  # indivisible set: cross-package workspace:^ deps are rewritten to the
  # stamped dev versions at pack time, so all six must exist with the SAME
  # suffix for the set to resolve. This list is duplicated on purpose — it must
  # exist as an env in devex-bridge.yml and devex-bridge-cleanup.yml, in the
  # pack/publish matrices below, and in use-dev-builds.mjs — and every copy is
  # guarded against drift by scripts/ci/check-package-lists.mjs.
  BRIDGED_PACKAGES: 'logger css-tokenizer agtree tsurlfilter dnr-rulesets tswebextension'
  VERSION_SUFFIX: 'pr${{ github.event.pull_request.number }}'
  AK_REGISTRY: ${{ vars.ARTIFACT_KEEPER_URL }}/npm/npm-internal

jobs:
  changes:
    name: Detect affected packages
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      bridge-needed: ${{ steps.gate.outputs.bridge-needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute affected packages
        id: affected
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/compute-affected-packages.mjs

      - name: Decide whether bridging is needed
        id: gate
        run: |
          node -e "
            const matrix = JSON.parse(process.env.MATRIX);
            const bridged = process.env.BRIDGED_PACKAGES.split(' ');
            const targets = (matrix.include ?? []).map((e) => e.target);
            const hit = bridged.some((p) => targets.includes(p));
            const needed = process.env.ROOT_AFFECTED === 'true' || hit;
            require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, \`bridge-needed=\${needed}\n\`);
          "
        env:
          MATRIX: ${{ steps.affected.outputs.matrix }}
          ROOT_AFFECTED: ${{ steps.affected.outputs.root-affected }}

  pack:
    name: Pack ${{ matrix.package }}
    needs: changes
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      # Cap concurrent Docker builds: the shared remote BuildKit builder OOMs /
      # drops connections under heavy parallelism (same rationale as build.yml).
      max-parallel: 4
      matrix:
        package: [logger, css-tokenizer, agtree, tsurlfilter, dnr-rulesets, tswebextension]
    runs-on: team-extensions
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inject development package versions
        uses: AdGuardSoftwareLimited/ext-shared-actions/.github/actions/set-dev-version@master
        with:
          package-globs: packages/*/package.json
          version-suffix: ${{ env.VERSION_SUFFIX }}

      # TODO: once ext-shared-actions#15 lands on master and this workflow runs
      # against it, set-dev-version@master stamps <next-patch>-dev.pr<N>
      # directly and this step is a real no-op — delete it then. Until #15
      # merges, the action cannot append the suffix, so this step is
      # load-bearing: without it every `-dev.pr<N>` would actually be plain
      # `-dev`. A wrong suffix (e.g. an empty VERSION_SUFFIX) is caught by the
      # "Verify tarball contents" step below. The rewrite preserves the
      # manifest's original indentation and line endings.
      - name: Ensure PR dev-version suffix
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          for (const dir of process.env.BRIDGED_PACKAGES.split(' ')) {
              const file = `packages/${dir}/package.json`;
              const source = fs.readFileSync(file, 'utf8');
              const indentMatch = source.match(/^{\r?\n([ \t]+)/);
              const indentation = indentMatch ? indentMatch[1] : source.includes('\n') ? '  ' : '';
              const pkg = JSON.parse(source);
              const stamped = `-dev.${process.env.VERSION_SUFFIX}`;
              if (!pkg.version.endsWith(stamped)) {
                  pkg.version = `${pkg.version}.${process.env.VERSION_SUFFIX}`;
                  const output = `${JSON.stringify(pkg, null, indentation)}\n`;
                  fs.writeFileSync(file, source.includes('\r\n') ? output.replace(/\n/g, '\r\n') : output);
              }
          }
          NODE

      - name: Build package tarball
        uses: ./.github/actions/docker-build
        with:
          target: build-${{ matrix.package }}-output
          dest: build-output

      # Same contract as _publish-release-monorepo.yml (scripts/ci/verify-tarball.sh):
      # a missing or mismatched tarball must fail here, not at publish time. The
      # script uses extraction-based checks (tar -xOf), NOT `tar -tzf | grep -q`:
      # under set -o pipefail that pipeline is racy — grep -q exits on the first
      # match, GNU tar dies of SIGPIPE ("tar: stdout: write error"), and pipefail
      # propagates the producer's failure as a false "package.json missing" error.
      # VERSION_SUFFIX is a workflow-level env var, so it is a plain environment
      # variable in the step shell; its value is built from the numeric PR number
      # only — no injection surface.
      - name: Verify tarball contents
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          TGZ="build-output/artifacts/${PACKAGE}.tgz"
          EXPECTED="$(node -p "require('./packages/${PACKAGE}/package.json').version")"
          if ! bash scripts/ci/verify-tarball.sh "${TGZ}" "${EXPECTED}"; then
            # verify-tarball.sh emits its ::error:: to stderr, which GitHub does
            # not render as an annotation; re-surface it on stdout here.
            echo "::error::${TGZ} failed verification (expected version ${EXPECTED}) — see output above"
            exit 1
          fi
          PACKED_VERSION="$(tar -xOf "${TGZ}" package/package.json | node -e "let json = ''; process.stdin.on('data', (d) => json += d).on('end', () => process.stdout.write(JSON.parse(json).version))")"
          case "${PACKED_VERSION}" in
            *-dev.${VERSION_SUFFIX}) ;;
            *) echo "::error::${TGZ} version ${PACKED_VERSION} does not end with -dev.${VERSION_SUFFIX}"; exit 1 ;;
          esac

      # Record the ACTUAL stamped version for the downstream unpublish (stale
      # cleanup) and comment jobs. This is the single source of the dev-version
      # map: no version arithmetic is duplicated anywhere in the workflow, so
      # what gets advertised (and, via suffix scan, kept/unpublished) is exactly
      # what was packed — it cannot drift from set-dev-version.
      - name: Record packed version
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync(\`packages/\${process.env.PACKAGE}/package.json\`, 'utf8'));
            fs.writeFileSync(\`\${process.env.PACKAGE}.json\`, JSON.stringify({ name: pkg.name, version: pkg.version }) + '\n');
          "

      - name: Upload version record
        uses: actions/upload-artifact@v7
        with:
          name: devex-version-${{ matrix.package }}
          path: ${{ matrix.package }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload dev package
        uses: actions/upload-artifact@v7
        with:
          name: devex-${{ matrix.package }}
          path: build-output/artifacts/${{ matrix.package }}.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.package }} to Artifact Keeper
    needs: [changes, pack]
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        package: [logger, css-tokenizer, agtree, tsurlfilter, dnr-rulesets, tswebextension]
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      # Publish FIRST, then clean up stale versions (unpublish). A failed
      # publish therefore degrades to the previous build still being present on
      # AK — never to a PR with no dev build — which is the property the
      # ordering review asked for.
      - name: Bail if the PR is no longer open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          set -euo pipefail
          if bash scripts/ci/check-pr-open.sh "${PR_URL}" "${GH_TOKEN}"; then
            exit 0
          fi
          code=$?
          if [[ "${code}" -eq 10 ]]; then
            # check-pr-open.sh already warned; skipping is intentional.
            exit 0
          fi
          exit "${code}"

      - name: Download dev package
        uses: actions/download-artifact@v8
        with:
          name: devex-${{ matrix.package }}
          path: .

      # AK versions are immutable: npm publish rejects an already-published
      # version with 409. A -dev.pr<N> version only changes when the package's
      # CHANGELOG is bumped in this PR, so "already published at this exact
      # version" means the dev build is current — treat it as a no-op rather
      # than a failure. Real publish errors still fail the job loudly.
      - name: Publish to Artifact Keeper (skip if already published)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          PACKAGE_FILE: ${{ matrix.package }}.tgz
          TAG: devex
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          # Auth comes from NODE_AUTH_TOKEN + the .npmrc written by setup-node,
          # so no explicit --registry here (matches deploy-to-ak-npm.yml).
          if out="$(npm publish "${PACKAGE_FILE}" --access public --tag "${TAG}" 2>&1)"; then
              echo "Published ${PACKAGE_FILE} (tag ${TAG})"
          elif grep -qE '\bE409\b|409 Conflict|already exists' <<<"${out}"; then
              echo "::warning::${PACKAGE_FILE}: already published on AK — immutable versions are not overwritten, skipping"
          else
              echo "::error::npm publish failed for ${PACKAGE_FILE}:"
              printf '%s\n' "${out}"
              exit 1
          fi

      # Close-during-run reconciliation: if the PR closed/merged while this job
      # was running (between the pre-publish state check and npm publish
      # finishing), the just-published version would otherwise survive forever —
      # the cleanup workflow already fired once and its `closed` event will not
      # come again. Unpublish it here, in the same run that created it.
      - name: Remove just-published version if the PR closed mid-run
        if: always()
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
          SUFFIX: '-dev.${{ env.VERSION_SUFFIX }}'
        run: |
          set -euo pipefail
          # First step's bail already returned 0 on "still open"; here we only
          # care about the transition: if the PR is now closed, delete what this
          # run published so no orphan remains. Anything else (including open)
          # is a no-op.
          set +e
          bash scripts/ci/check-pr-open.sh "${PR_URL}" "${GH_TOKEN}" >/dev/null 2>&1
          state_code=$?
          set -e
          if [[ "${state_code}" -eq 0 ]]; then
            echo "PR still open; keeping the published version"
            exit 0
          fi
          if [[ "${state_code}" -ne 10 ]]; then
            # Could not determine state — safest is to leave the version and
            # let the cleanup sweep / manual action handle it (fail loudly so
            # it is noticed).
            echo "::error::Could not re-check PR state (code ${state_code}) after publishing ${{ matrix.package }}"
            exit 1
          fi
          echo "PR #${{ github.event.pull_request.number }} closed during this run — removing ${{ matrix.package }} from AK"
          bash scripts/ci/ak-dev-unpublish.sh \
            "@adguard/${{ matrix.package }}" "${AK_REGISTRY}" "${SUFFIX}"

  unpublish:
    name: Clean up stale AK dev versions
    # Runs AFTER a successful publish: deletes only -dev.pr<N> versions that are
    # NOT the ones just published (kept explicitly), so a mid-PR CHANGELOG bump
    # or a re-push never leaves duplicate/stale versions, and a failed publish
    # leaves the previous build intact. Shares the registry error taxonomy with
    # the cleanup workflow via scripts/ci/ak-dev-unpublish.sh.
    needs: [changes, publish]
    if: >-
      needs.changes.outputs.bridge-needed == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      - name: Bail if the PR is no longer open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          set -euo pipefail
          if bash scripts/ci/check-pr-open.sh "${PR_URL}" "${GH_TOKEN}"; then
            exit 0
          fi
          code=$?
          if [[ "${code}" -eq 10 ]]; then
            exit 0
          fi
          exit "${code}"

      - name: Download version records
        uses: actions/download-artifact@v8
        with:
          pattern: devex-version-*
          path: versions
          merge-multiple: true

      # Delete every -dev.pr<N> version on AK for a bridged package EXCEPT the
      # versions recorded as freshly packed (this push's build). Suffix scan —
      # not version equality — so '-dev.pr1' never matches '-dev.pr12' and a
      # prior push's stale build left by a CHANGELOG bump is still removed.
      - name: Unpublish stale dev versions by suffix
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          SUFFIX: '-dev.${{ env.VERSION_SUFFIX }}'
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          keep_list="$(node -e "
            const fs = require('node:fs');
            const records = fs.readdirSync('versions').filter((f) => f.endsWith('.json'));
            const keep = records.map((f) => JSON.parse(fs.readFileSync(\`versions/\${f}\`, 'utf8')).version);
            process.stdout.write(keep.join('\n'));
          ")"
          for pkg in ${BRIDGED_PACKAGES}; do
            name="@adguard/${pkg}"
            keep_args=()
            while IFS= read -r version; do
              [[ -n "${version}" ]] || continue
              keep_args+=(--keep "${version}")
            done <<< "${keep_list}"
            bash scripts/ci/ak-dev-unpublish.sh \
              "${name}" "${AK_REGISTRY}" "${SUFFIX}" \
              --tolerate-405 \
              "${keep_args[@]}"
          done

  comment:
    name: Post usage comment on the source PR
    needs: [changes, publish]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bail if the PR is no longer open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          set -euo pipefail
          if bash scripts/ci/check-pr-open.sh "${PR_URL}" "${GH_TOKEN}"; then
            exit 0
          fi
          code=$?
          if [[ "${code}" -eq 10 ]]; then
            # Don't advertise "Dev builds published" on a closed PR.
            exit 0
          fi
          exit "${code}"

      - name: Download version records
        uses: actions/download-artifact@v8
        with:
          pattern: devex-version-*
          path: versions
          merge-multiple: true

      - name: Emit packed versions map
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "${GITHUB_OUTPUT}"
          const fs = require('node:fs');
          const records = fs.readdirSync('versions').filter((f) => f.endsWith('.json')).sort();
          const map = {};
          for (const file of records) {
              const record = JSON.parse(fs.readFileSync(`versions/${file}`, 'utf8'));
              if (!record.name || typeof record.version !== 'string') {
                  console.error(`::error::version record ${file} is malformed: ${JSON.stringify(record)}`);
                  process.exit(1);
              }
              map[record.name] = record.version;
          }
          const expected = process.env.BRIDGED_PACKAGES.split(' ').map((p) => `@adguard/${p}`);
          const missing = expected.filter((name) => !(name in map));
          if (missing.length > 0) {
              console.error(`::error::missing packed version records for: ${missing.join(', ')}`);
              process.exit(1);
          }
          console.log(`map=${JSON.stringify(map)}`);
          NODE

      # A PR "comment" is an issue comment, and this repository has the Issues
      # feature disabled — GITHUB_TOKEN cannot hit /issues/*/comments there
      # (403 "Resource not accessible by integration"). Posting a pull-request
      # review (event: COMMENT) uses the pull-requests resource instead and
      # works regardless. Reviews are immutable, so upsert = update the body of
      # OUR OWN review carrying the marker (listReviews is paginated so a busy
      # PR can never produce a duplicate, and matching only the bot's own
      # reviews guarantees we never rewrite a human reviewer's text).
      - name: Upsert dev-builds review
        uses: actions/github-script@v8
        env:
          MAP: ${{ steps.versions.outputs.map }}
          AK_REGISTRY: ${{ env.AK_REGISTRY }}
        with:
          script: |
            const marker = '<!-- devex-bridge -->';
            const pr = context.payload.pull_request.number;
            const map = JSON.parse(process.env.MAP);
            const rows = Object.entries(map)
                .map(([name, version]) => `| \`${name}\` | \`${version}\` |`)
                .join('\n');
            const body = [
                marker,
                '**Dev builds published** to the internal Artifact Keeper registry (republished when this PR bumps a package CHANGELOG; re-run the pin command below to refresh the lockfile integrity):',
                '',
                '| package | version |',
                '| --- | --- |',
                rows,
                '',
                'To build the browser extension against them, create your branch in `AdGuardSoftwareLimited/browser-extension` as usual, then pin the dev builds from an up-to-date tsurlfilter checkout:',
                '',
                '```bash',
                `node scripts/use-dev-builds.mjs --pr ${pr} --registry ${process.env.AK_REGISTRY} --extension /path/to/browser-extension`,
                '```',
                '',
                'Re-run the same command after every push to this PR (immutable AK versions are republished only on a CHANGELOG bump; re-pinning refreshes the lockfile integrity).',
                'These versions are deleted automatically when this PR is closed or merged.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: pr, per_page: 100 },
            );
            const existing = reviews.find(
                (r) => r.user?.login === 'github-actions[bot]' && r.body?.includes(marker),
            );
            if (existing) {
                if (existing.body !== body) {
                    await github.rest.pulls.updateReview({
                        owner, repo, pull_number: pr, review_id: existing.id, body,
                    });
                }
            } else {
                await github.rest.pulls.createReview({
                    owner, repo, pull_number: pr, event: 'COMMENT', body,
                });
            }

  notify-failure:
    name: Notify bridge failure
    needs: [changes, pack, publish, unpublish, comment]
    # Bridge failures would otherwise only be visible on the PR checks.
    if: >-
      failure() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':x: *devex-bridge* failed for PR #${{ github.event.pull_request.number }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>'
          color: danger
