  # Serialized retry pass.
  #
  # The shared deploy-to-npm workflow gives us no way to read its npm stderr
  # (so we cannot distinguish a 429 from other failures), and a reusable
  # workflow job cannot be retried from within. Instead, every line whose
  # PRIMARY publish failed gets one second chance below, re-publishing the
  # same artifact through the same deploy-to-npm workflow, in the same order
  # as the primary chain (5.0 first).
