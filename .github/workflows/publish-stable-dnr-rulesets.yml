name: Publish stable DNR rulesets

# Twice daily (00:17/12:17 UTC; :17 stays off GitHub's busy top-of-hour and
# lands ahead of the 00:30/12:30 browser-extension auto-build) build + publish
# @adguard/dnr-rulesets from the stable/dnr-rulesets-5.0 branch. Only the 5.0
# line is published (it introduced the switch from @adguard/tsurlfilter's DNR
# APIs to the standalone @adguard/dnr-converter and is what consumers read).
# The branch must be on the current CI; resolve-lines checks that and skips it
# so a not-yet-migrated round stays green. The line stamps a
# 5.0.<utc-timestamp> version, builds its Docker target, and publishes via the
# shared deploy-to-npm workflow (out of scope).
#
# Background — npm HTTP 429. That shared workflow publishes from GitHub-hosted
# ubuntu-latest egress IPs, which npm/Cloudflare rate-limit aggressively, and a
# fresh publish of this package is a heavy registry write (~22k versions,
# ~79 MB packument, ~47 MB tarball). Multiple back-to-back writes exceeded a
# burst budget of ~3 per window (npm's ~70 s retry is shorter than the throttle
# window); publishing just the single 5.0 line keeps the round inside that
# budget. Two repo-local measures keep the write safe:
#   1. Idempotency. scripts/ci/check-npm-version.sh verifies the exact version
#      isn't already on npm before publishing, so re-runs / a PUT that actually
#      landed skip instead of failing with 409.
#   2. Retry. After the primary publish, a failed one gets one more pass
#      through deploy-to-npm, after a 10-minute backoff and the same re-check.
# Dist-tag: 5.0 (the only published line) is `latest` — no older line exists to
# move it backwards.
# Limitation: the shared workflow still publishes on ubuntu-latest; that
# runner choice is in the out-of-scope repo and can't be changed from here.

on:
  schedule:
    # Browser extension collects a fresh @adguard/dnr-rulesets only every 12 h
    # at 00:30/12:30 (cron '30 */12 * * *'), so hourly rounds just re-published
    # and kept tripping 429s. Running at :17 keeps 5.0 — the `latest` tag
    # consumers pull — on npm before that :30 build.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      line:
        description: 'Specific stable line to publish (e.g. 5.0); empty = the migrated 5.0 line'
        required: false
        type: string

# Rounds can overrun the hour; serialize them so two runs never publish
# overlapping timestamped versions.
concurrency:
  group: publish-stable-dnr-rulesets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-lines:
    name: Resolve migrated stable lines
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.lines.outputs.matrix }}
      # "In this round" flag gates the unrolled chain below (the JSON `matrix`
      # is only used by the build matrix job). Keys can't hold dots, hence
      # 5.0 -> line-5-0.
      line-5-0: ${{ steps.lines.outputs.line-5-0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute lines to build
        id: lines
        shell: bash
        env:
          REQUESTED_LINE: ${{ inputs.line || '' }}
        run: |
          set -euo pipefail

          ALL_LINES="5.0"
          if [ -n "$REQUESTED_LINE" ]; then
            case " $ALL_LINES " in
              *" $REQUESTED_LINE "*)
                LINES="$REQUESTED_LINE"
                ;;
              *)
                echo "::error::Unknown stable line '$REQUESTED_LINE'; expected one of:$ALL_LINES"
                exit 1
                ;;
            esac
          else
            LINES="$ALL_LINES"
          fi

          # "On the current CI" = the injector script, the shared docker-build
          # action, the helper scripts, and the root Dockerfile's
          # dnr-rulesets-auto-build-output target all exist at the branch tip.
          # Probe each branch shallowly — no full clones, no gh dependency.
          INCLUDE=""
          for line in $LINES; do
            # Flag output for this line; left unset when skipped, which the
            # per-line jobs read as "not in this round".
            flag="line-${line//./-}"
            ref="refs/heads/stable/dnr-rulesets-${line}"
            if git fetch -q --depth=1 origin "${ref}" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/inject-package-versions.mjs" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:.github/actions/docker-build/action.yml" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/timeout-wrapper.sh" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/copy-test-reports.sh" 2>/dev/null \
              && git show "FETCH_HEAD:Dockerfile" 2>/dev/null | grep -q 'dnr-rulesets-auto-build-output'; then
              if [ -n "$INCLUDE" ]; then INCLUDE="${INCLUDE},"; fi
              INCLUDE="${INCLUDE}{\"line\":\"${line}\"}"
              echo "${flag}=true" >> "$GITHUB_OUTPUT"
            else
              if [ -n "$REQUESTED_LINE" ]; then
                # An explicit dispatch asked for this line: fail loudly instead
                # of silently publishing nothing.
                echo "::error::Requested line '$line' is not on the current CI (no scripts/inject-package-versions.mjs, .github/actions/docker-build, scripts/ci helpers, or dnr-rulesets-auto-build-output target on stable/dnr-rulesets-${line}); backport the CI first"
                exit 1
              fi
              echo "Line ${line} is not on the current CI yet; skipping this round (backport pending)"
            fi
          done

          # An empty schedule round stays green: every downstream job gates on
          # its line flag, so the run completes without a Slack alert.
          echo "matrix={\"include\":[${INCLUDE}]}" >> "$GITHUB_OUTPUT"

  build-stable-dnr-rulesets:
    name: Build DNR rulesets ${{ matrix.line }}
    needs: resolve-lines
    if: ${{ needs.resolve-lines.result == 'success' && fromJSON(needs.resolve-lines.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      # Cap concurrent Docker builds: the shared remote BuildKit builder OOMs /
      # drops connections under heavy parallelism (build.yml caps its own
      # matrix at 4 for the same reason).
      max-parallel: 4
      matrix: ${{ fromJSON(needs.resolve-lines.outputs.matrix) }}
    runs-on: team-extensions
    timeout-minutes: 30
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable/dnr-rulesets-${{ matrix.line }}
          # .git is dockerignored and the stamp comes from changelogs, not git
          # history — a shallow clone is enough.
          fetch-depth: 1

      - name: Stamp stable version
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d%H%M%S)
          STABLE_VERSION="${{ matrix.line }}.${TS}"
          echo "Stable version: ${STABLE_VERSION}"
          node scripts/inject-package-versions.mjs \
            --package dnr-rulesets \
            --version "${STABLE_VERSION}"

      - name: Build package
        uses: ./.github/actions/docker-build
        with:
          target: dnr-rulesets-auto-build-output
          dest: build-output
          cache-suffix: -${{ matrix.line }}

      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          TGZ=build-output/artifacts/dnr-rulesets.tgz
          PACKED_VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Escape the dots in the line prefix (e.g. 5.0) so the regex cannot
          # match a tampered version like 5x0.20260819120000.
          STABLE_RE="${{ matrix.line }}"
          STABLE_RE="${STABLE_RE//./\\.}"
          [[ "$PACKED_VERSION" =~ ^${STABLE_RE}\.[0-9]{14}$ ]] || { echo "::error::$TGZ has unexpected stable version $PACKED_VERSION"; exit 1; }

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: dnr-rulesets-${{ matrix.line }}
          path: build-output/artifacts/dnr-rulesets.tgz
          # Hand-off only to the publish/retry jobs in the same run; 1-day
          # retention avoids accumulating ~120 artifacts a day.
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Primary chain.
  #
  # One job for the single published line (5.0). With a single publish there is
  # nothing to stagger: no `strategy.max-parallel`, no spacing sleep (a `uses:`
  # publish job can't hold a sleep step anyway). The check runs on
  # team-extensions — stable egress, unlike the 429-prone ubuntu-latest the
  # shared publish uses.
  #
  # The job has an explicit `if:`. A custom condition overrides GitHub's
  # implicit "needs succeeded" gate, and it lists the build matrix job in
  # `needs` without gating on its result, so a failed build leg only fails its
  # own line (its artifact is missing, its check fails, its publish skips).
  # ---------------------------------------------------------------------------

  check-5-0:
    name: Check 5.0 version not on npm yet
    needs: [resolve-lines, build-stable-dnr-rulesets]
    if: ${{ needs.resolve-lines.result == 'success' && needs.resolve-lines.outputs.line-5-0 == 'true' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      # First publish: nothing to space from, so no sleep step here.
      - name: Checkout version-check script
        # Sparse: the check only needs scripts/ci (the full repo clone is huge).
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1

      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-5.0
          path: artifact

      - name: Check target version not on npm yet
        id: version-check
        shell: bash
        run: bash scripts/ci/check-npm-version.sh artifact/dnr-rulesets.tgz

  publish-5-0:
    name: Publish DNR rulesets 5.0
    needs: [resolve-lines, build-stable-dnr-rulesets, check-5-0]
    if: ${{ !cancelled() && needs.resolve-lines.outputs.line-5-0 == 'true' && needs.check-5-0.result == 'success' && needs.check-5-0.outputs.exists == 'false' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-5.0
      package-file: dnr-rulesets.tgz
      # Newest supported line -> `latest` (see header on dist-tags). No GitHub
      # environment so unattended scheduled runs don't hang on approval.
      tag: latest
      environment: ''
    permissions:
      contents: read
      id-token: write

  # ---------------------------------------------------------------------------
  # Retry pass.
  #
  # deploy-to-npm exposes no npm stderr (we can't tell a 429 from other
  # failures) and a reusable workflow job can't be retried from within, so a
  # failed primary publish gets one second chance below. retry-5-0 waits for
  # publish-5-0 so the retry always runs strictly after the primary, never
  # sharing a throttle window with it. The 10-minute sleep is the backoff; the
  # re-check makes a PUT that actually landed a no-op instead of a 409 (the run
  # still shows red and Slack still fires — a line that needed a retry is worth
  # an alert).
  # ---------------------------------------------------------------------------

  retry-5-0:
    name: Retry 5.0
    needs: [build-stable-dnr-rulesets, publish-5-0]
    if: ${{ needs.publish-5-0.result == 'failure' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 20
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Back off
        shell: bash
        run: sleep 600

      - name: Checkout version-check script
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1

      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-5.0
          path: artifact

      - name: Re-check target version on npm
        id: version-check
        shell: bash
        run: bash scripts/ci/check-npm-version.sh artifact/dnr-rulesets.tgz

  retry-publish-5-0:
    name: Publish DNR rulesets 5.0 (retry)
    needs: [retry-5-0]
    if: ${{ !cancelled() && needs.retry-5-0.result == 'success' && needs.retry-5-0.outputs.exists == 'false' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-5.0
      package-file: dnr-rulesets.tgz
      tag: latest
      environment: ''
    permissions:
      contents: read
      id-token: write

  notify-failure:
    name: Notify on failure
    # All legs can fail; an empty round or a cancelled run is not a failure:
    # per-line jobs skip and `failure()` stays false, no Slack alert.
    needs: [resolve-lines, build-stable-dnr-rulesets, check-5-0, publish-5-0, retry-5-0, retry-publish-5-0]
    if: ${{ failure() }}
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':x: *publish-stable-dnr-rulesets* failed — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>'
          color: danger
