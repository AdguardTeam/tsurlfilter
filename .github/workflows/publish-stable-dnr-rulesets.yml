name: Publish stable DNR rulesets

# Twice daily (00:17 and 12:17 UTC) build and publish of
# @adguard/dnr-rulesets from the supported stable/dnr-rulesets-* branches
# (3.3, 4.0, 4.1, 4.2, 5.0). Each supported branch must be on the current CI
# (root Dockerfile + scripts/inject-package-versions.mjs): the job checks out
# the pinned branch, stamps a <line>.<timestamp> stable version into its
# manifest, builds its own dnr-rulesets-auto-build-output target, and
# publishes via trusted npm. Lines whose branch has not been migrated to the
# current CI are skipped gracefully (see the resolve-lines job) so the runs
# neither fail nor spam Slack during the backport window.
#
# npm rate limits (HTTP 429). The registry/Cloudflare aggressively throttles
# GitHub-hosted ubuntu-latest egress IPs — which is where the shared
# deploy-to-npm workflow runs its publishes — and a fresh publish of
# @adguard/dnr-rulesets is an expensive registry write (~22 000 published
# versions, ~79 MB packument, ~47 MB tarball). Five back-to-back publishes
# blow a burst budget of roughly three per short window, so without
# mitigation ~2 of the 5 lines failed every round (even the pre-publish
# packument GET got 429'd, and npm's ~70 s built-in retry is shorter than the
# registry's throttle window). We only control this repository, so the fix is
# three repo-local measures (the shared workflow repo is out of scope):
#   1. Staggering. The publish matrix is unrolled into one job per line,
#      chained by spacer jobs (~7 minutes) so the five registry writes are
#      always minutes apart. A reusable-workflow job (`uses:`) cannot contain
#      steps, so the sleep must live in a separate spacer job between the
#      publish jobs; chaining via explicit `needs` (rather than a delay job
#      inside one matrix) is what actually puts time *between* publishes.
#      5.0 publishes FIRST in the chain: the burst budget is spent early, so
#      the first publish has the best chance of landing, and 5.0 is the line
#      that most consumers read (it is also the `latest` dist-tag, see below).
#      The remaining lines keep their prior relative order.
#   2. Idempotency. A self-hosted check job per line verifies the exact
#      <line>.<timestamp> version is not already on npm before the publish, so
#      any retried execution — GitHub's "re-run failed jobs", the retry pass
#      below, or a first attempt whose PUT actually landed server-side —
#      skips instead of dying with a 409 conflict.
#   3. A serialized retry pass. After the primary chain, every line whose
#      publish failed gets one second chance through the same deploy-to-npm
#      workflow, preceded by a 10-minute backoff and the same existence
#      re-check. Retries only consume the npm budget for versions that
#      genuinely never landed.
# Dist-tags: 5.0 is the newest supported line, so it is published under the
# `latest` dist-tag (deploy-to-npm publishes under exactly one dist-tag, and
# re-publishing the same version under a second tag would 409, so `latest`
# comes from the publish itself). The older lines stay pinned to their
# per-line `stable-<line>` dist-tags and can never move `latest` backwards.
# Trade-off: the staggered round now spans roughly 45–75 minutes instead of
# ~15, so lines published after the 00:30/12:30 browser-extension auto-build
# window are only consumed by the next window 12 h later. That is still
# strictly better than the previous state, in which ~2 of 5 lines failed to
# publish at all and then stayed stale until the next round.
# Limitation: our own jobs run on the self-hosted team-extensions runners
# (stable egress IPs), but the shared deploy-to-npm workflow pins its own
# runner (ubuntu-latest) for the actual publishes. That runner choice lives
# in the out-of-scope shared repository and cannot be changed from here.

on:
  schedule:
    # Twice a day at 00:17 / 12:17 UTC instead of hourly. The browser-extension
    # auto-build (browser-extension/.github/workflows/auto-build.yml, cron
    # '30 */12 * * *') picks up a fresh @adguard/dnr-rulesets only every 12 h
    # (00:30/12:30 UTC), so only the rounds right before it were ever consumed
    # and publishing hourly — five packages per round — kept tripping npm rate
    # limits (HTTP 429). Running at :17 keeps the first line(s) — headed by
    # 5.0, the `latest` tag consumers pull — on npm before the extension build
    # collects them (later staggered lines land after the window and are picked
    # up by the following cycle — see the header), and the :17 minute stays off
    # GitHub's busiest top-of-hour slots (see the schedule docs).
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      line:
        description: 'Specific stable line to publish (e.g. 4.2); empty = all migrated lines'
        required: false
        type: string

# Rounds can overrun the hour (five Docker builds plus the staggered publish
# chain on the shared runner pool); serialize them so two runs never publish
# overlapping timestamped versions.
concurrency:
  group: publish-stable-dnr-rulesets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-lines:
    name: Resolve migrated stable lines
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.lines.outputs.matrix }}
      # Per-line "this line is in the round" flags for the unrolled publish
      # chain below (the JSON `matrix` is only consumed by the build matrix
      # job; per-line jobs gate on these booleans instead of re-parsing it).
      # Output keys cannot contain dots, hence 3.3 -> line-3-3.
      line-3-3: ${{ steps.lines.outputs.line-3-3 }}
      line-4-0: ${{ steps.lines.outputs.line-4-0 }}
      line-4-1: ${{ steps.lines.outputs.line-4-1 }}
      line-4-2: ${{ steps.lines.outputs.line-4-2 }}
      line-5-0: ${{ steps.lines.outputs.line-5-0 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute lines to build
        id: lines
        shell: bash
        env:
          REQUESTED_LINE: ${{ inputs.line || '' }}
        run: |
          set -euo pipefail

          ALL_LINES="3.3 4.0 4.1 4.2 5.0"
          if [ -n "$REQUESTED_LINE" ]; then
            case " $ALL_LINES " in
              *" $REQUESTED_LINE "*)
                LINES="$REQUESTED_LINE"
                ;;
              *)
                echo "::error::Unknown stable line '$REQUESTED_LINE'; expected one of:$ALL_LINES"
                exit 1
                ;;
            esac
          else
            LINES="$ALL_LINES"
          fi

          # The current-CI prerequisite is the injector script, the shared
          # docker-build composite action, the CI helper scripts the build stage
          # runs, AND the root Dockerfile carrying the
          # dnr-rulesets-auto-build-output target at the branch tip. With them
          # comes the whole current CI. Fetch each single branch shallowly and
          # probe the tree — no full clones, no gh dependency.
          INCLUDE=""
          for line in $LINES; do
            # Flag output for this line; left unset when the line is skipped,
            # which the publish/check jobs read as "not in this round".
            flag="line-${line//./-}"
            ref="refs/heads/stable/dnr-rulesets-${line}"
            if git fetch -q --depth=1 origin "${ref}" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/inject-package-versions.mjs" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:.github/actions/docker-build/action.yml" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/timeout-wrapper.sh" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/copy-test-reports.sh" 2>/dev/null \
              && git show "FETCH_HEAD:Dockerfile" 2>/dev/null | grep -q 'dnr-rulesets-auto-build-output'; then
              if [ -n "$INCLUDE" ]; then INCLUDE="${INCLUDE},"; fi
              INCLUDE="${INCLUDE}{\"line\":\"${line}\"}"
              echo "${flag}=true" >> "$GITHUB_OUTPUT"
            else
              if [ -n "$REQUESTED_LINE" ]; then
                # An explicit dispatch asked for this line: fail loudly instead
                # of silently publishing nothing.
                echo "::error::Requested line '$line' is not on the current CI (no scripts/inject-package-versions.mjs, .github/actions/docker-build, scripts/ci helpers, or dnr-rulesets-auto-build-output target on stable/dnr-rulesets-${line}); backport the CI first"
                exit 1
              fi
              echo "Line ${line} is not on the current CI yet; skipping this round (backport pending)"
            fi
          done

          # An empty schedule round (no lines migrated yet) stays green: every
          # downstream job gates on its line being present, so the run
          # completes without a Slack failure alert.
          echo "matrix={\"include\":[${INCLUDE}]}" >> "$GITHUB_OUTPUT"

  build-stable-dnr-rulesets:
    name: Build DNR rulesets ${{ matrix.line }}
    needs: resolve-lines
    if: ${{ needs.resolve-lines.result == 'success' && fromJSON(needs.resolve-lines.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      # Cap concurrent Docker builds: the shared remote BuildKit builder OOMs /
      # drops connections under heavy parallelism (build.yml caps its own
      # matrix at 4 for the same reason).
      max-parallel: 4
      matrix: ${{ fromJSON(needs.resolve-lines.outputs.matrix) }}
    runs-on: team-extensions
    timeout-minutes: 30
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable/dnr-rulesets-${{ matrix.line }}
          # The version stamp comes from the changelogs, not git history, and
          # .git is dockerignored anyway — a shallow clone is enough (no five
          # full clones per hour).
          fetch-depth: 1

      - name: Stamp stable version
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d%H%M%S)
          STABLE_VERSION="${{ matrix.line }}.${TS}"
          echo "Stable version: ${STABLE_VERSION}"
          node scripts/inject-package-versions.mjs \
            --package dnr-rulesets \
            --version "${STABLE_VERSION}"

      - name: Build package
        uses: ./.github/actions/docker-build
        with:
          target: dnr-rulesets-auto-build-output
          dest: build-output
          cache-suffix: -${{ matrix.line }}

      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          TGZ=build-output/artifacts/dnr-rulesets.tgz
          PACKED_VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Escape the dots in the line prefix (e.g. 3.3) so the regex cannot
          # match a tampered version like 3x3.20260819120000.
          STABLE_RE="${{ matrix.line }}"
          STABLE_RE="${STABLE_RE//./\\.}"
          [[ "$PACKED_VERSION" =~ ^${STABLE_RE}\.[0-9]{14}$ ]] || { echo "::error::$TGZ has unexpected stable version $PACKED_VERSION"; exit 1; }

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: dnr-rulesets-${{ matrix.line }}
          path: build-output/artifacts/dnr-rulesets.tgz
          # These tarballs only hand off to the (publish, retry) jobs in the
          # same run — a 1-day retention keeps the hand-off working without
          # accumulating ~120 artifacts a day at the 90-day default.
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Staggered primary publish chain.
  #
  # The old `publish-stable-dnr-rulesets` matrix job is unrolled into one job
  # per line, headed by 5.0 so it gets the best chance of landing within the
  # npm burst budget (the budget is spent early). Serialization no longer
  # needs `strategy.max-parallel: 1` — each publish job `needs` the previous
  # spacer job, so the next publish can never start until the previous one
  # (and its ~7 minute spacer) finished, which is strictly stronger than
  # max-parallel. Every chain link uses an explicit `if:` because a custom
  # condition overrides GitHub's implicit "all `needs` succeeded" rule:
  # without it, a failed/skipped predecessor would transitively skip the whole
  # rest of the chain and a failed line would block its healthy successors.
  #
  # Each line also gets a ~cheap self-hosted existence check first, because
  # running it on the stable-egress team-extensions runner (instead of the
  # 429-prone ubuntu-latest used by the shared publish workflow) makes the
  # check itself reliable. The check reads the exact version out of the built
  # artifact — it cannot be recomputed, since the <line>.<timestamp> stamp is
  # taken once during the build.
  # ---------------------------------------------------------------------------

  check-5-0:
    name: Check 5.0 version not on npm yet
    needs: [resolve-lines, build-stable-dnr-rulesets]
    # Custom `if` so a failed build leg for ANOTHER line cannot transitively
    # skip this line's check (failed lines must not block healthy ones). A
    # missing artifact for THIS line fails this job's download below, which
    # in turn skips only this line's publish.
    if: ${{ needs.resolve-lines.result == 'success' && needs.resolve-lines.outputs.line-5-0 == 'true' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-5.0
          path: artifact

      - name: Check target version on npm
        id: version-check
        shell: bash
        run: |
          set -euo pipefail
          TGZ=artifact/dnr-rulesets.tgz
          VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Per-version registry endpoint: a tiny filtered response, far
          # cheaper than the ~79 MB packument `npm view` would have to fetch.
          HTTP=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@adguard/dnr-rulesets/${VERSION}" 2>/dev/null) || HTTP=000
          case "$HTTP" in
            200)
              echo "::warning::Version ${VERSION} already exists on npm; skipping this publish (likely a previous attempt landed)"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # 404 = absent; 429/5xx/timeout = unverifiable, assume absent.
              # An existence check must never block a legitimate publish — the
              # publish itself is the source of truth, and a wrong "absent"
              # only risks a single throttled publish attempt (for which the
              # retry pass below is the backstop).
              if [ "$HTTP" != "404" ]; then
                echo "::warning::npm version check returned ${HTTP} for ${VERSION}; assuming not published and proceeding"
              fi
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-5-0:
    name: Publish DNR rulesets 5.0
    needs: [resolve-lines, build-stable-dnr-rulesets, check-5-0]
    # Custom `if` (see chain comment): our own check must have succeeded with
    # the version absent; the other lines' outcomes are irrelevant here. No
    # spacer precedes the FIRST publish — nothing needs spacing from.
    if: ${{ !cancelled() && needs.resolve-lines.outputs.line-5-0 == 'true' && needs.check-5-0.result == 'success' && needs.check-5-0.outputs.exists == 'false' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-5.0
      package-file: dnr-rulesets.tgz
      # 5.0 is the newest supported line, so it is published under `latest`
      # (the dist-tag most consumers pull). Older lines stay on their
      # per-line `stable-<line>` tags so they can never move `latest`
      # backwards. deploy-to-npm publishes under exactly one dist-tag, and
      # re-publishing the same version under a second tag would 409, so
      # `latest` comes from this publish itself.
      tag: latest
      # No GitHub environment (empty string) so unattended scheduled runs
      # don't hang on approval.
      environment: ''
    permissions:
      contents: read
      id-token: write

  space-3-3:
    name: Wait before 3.3 publish
    needs: [resolve-lines, publish-5-0]
    # ~7 minute spacer (middle of the 5–10 minute target from the header)
    # between consecutive registry writes. Runs even when publish-5-0 FAILED —
    # after a 429 the throttle window must elapse before the next line tries —
    # but is skipped when publish-5-0 was skipped (its version already
    # existed: nothing consumed the npm budget, so no spacing is needed; then
    # `result != 'failure'` on publish-3-3 lets it proceed).
    if: ${{ needs.resolve-lines.outputs.line-3-3 == 'true' && needs.publish-5-0.result != 'skipped' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 15
    steps:
      - name: Wait
        shell: bash
        run: sleep 420

  check-3-3:
    name: Check 3.3 version not on npm yet
    needs: [resolve-lines, build-stable-dnr-rulesets]
    # Custom `if` so a failed build leg for ANOTHER line cannot transitively
    # skip this line's check (failed lines must not block healthy ones). A
    # missing artifact for THIS line fails this job's download below, which
    # in turn skips only this line's publish.
    if: ${{ needs.resolve-lines.result == 'success' && needs.resolve-lines.outputs.line-3-3 == 'true' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Download built package
        # Keep the major in lockstep with actions/upload-artifact (v7) used by
        # the build job — an artifact download must understand the format the
        # uploader wrote.
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-3.3
          path: artifact

      - name: Check target version on npm
        id: version-check
        shell: bash
        run: |
          set -euo pipefail
          TGZ=artifact/dnr-rulesets.tgz
          VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Per-version registry endpoint: a tiny filtered response, far
          # cheaper than the ~79 MB packument `npm view` would have to fetch.
          HTTP=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@adguard/dnr-rulesets/${VERSION}" 2>/dev/null) || HTTP=000
          case "$HTTP" in
            200)
              echo "::warning::Version ${VERSION} already exists on npm; skipping this publish (likely a previous attempt landed)"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # 404 = absent; 429/5xx/timeout = unverifiable, assume absent.
              # An existence check must never block a legitimate publish — the
              # publish itself is the source of truth, and a wrong "absent"
              # only risks a single throttled publish attempt (for which the
              # retry pass below is the backstop).
              if [ "$HTTP" != "404" ]; then
                echo "::warning::npm version check returned ${HTTP} for ${VERSION}; assuming not published and proceeding"
              fi
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-3-3:
    name: Publish DNR rulesets 3.3
    needs: [resolve-lines, build-stable-dnr-rulesets, check-3-3, space-3-3]
    # Custom `if` (see chain comment): our own check must have succeeded with
    # the version absent; the other lines' outcomes are irrelevant here.
    # `space-3-3.result != 'failure'` rather than `== 'success'`: the spacer
    # is intentionally skipped in partial rounds (e.g. a dispatch that
    # includes 3.3 but not 5.0) and a skipped spacer must not swallow this
    # line. A spacer FAILURE (runner/infra blip) does skip the publish —
    # spacing is the point, so we refuse to publish back-to-back after a
    # hiccup; the next line's chain self-heals since it only needs this one
    # to not have failed.
    if: ${{ !cancelled() && needs.resolve-lines.outputs.line-3-3 == 'true' && needs.check-3-3.result == 'success' && needs.check-3-3.outputs.exists == 'false' && needs.space-3-3.result != 'failure' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-3.3
      package-file: dnr-rulesets.tgz
      # Per-line dist-tag: an old line can never move `@adguard/dnr-rulesets@latest`
      # backwards (only 5.0 is `latest`). No GitHub environment (empty string) so
      # unattended scheduled runs don't hang on approval.
      tag: stable-3.3
      environment: ''
    permissions:
      contents: read
      id-token: write

  space-4-0:
    name: Wait before 4.0 publish
    needs: [resolve-lines, publish-3-3]
    # ~7 minute spacer (middle of the 5–10 minute target from the header)
    # between consecutive registry writes. Runs even when publish-3-3 FAILED —
    # after a 429 the throttle window must elapse before the next line tries —
    # but is skipped when publish-3-3 was skipped (its version already
    # existed: nothing consumed the npm budget, so no spacing is needed; then
    # `result != 'failure'` on publish-4-0 lets it proceed).
    if: ${{ needs.resolve-lines.outputs.line-4-0 == 'true' && needs.publish-3-3.result != 'skipped' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 15
    steps:
      - name: Wait
        shell: bash
        run: sleep 420

  check-4-0:
    name: Check 4.0 version not on npm yet
    needs: [resolve-lines, build-stable-dnr-rulesets]
    if: ${{ needs.resolve-lines.result == 'success' && needs.resolve-lines.outputs.line-4-0 == 'true' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-4.0
          path: artifact

      - name: Check target version on npm
        id: version-check
        shell: bash
        run: |
          set -euo pipefail
          TGZ=artifact/dnr-rulesets.tgz
          VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          HTTP=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@adguard/dnr-rulesets/${VERSION}" 2>/dev/null) || HTTP=000
          case "$HTTP" in
            200)
              echo "::warning::Version ${VERSION} already exists on npm; skipping this publish (likely a previous attempt landed)"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "$HTTP" != "404" ]; then
                echo "::warning::npm version check returned ${HTTP} for ${VERSION}; assuming not published and proceeding"
              fi
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-4-0:
    name: Publish DNR rulesets 4.0
    needs: [resolve-lines, build-stable-dnr-rulesets, check-4-0, space-4-0]
    # `space-4-0.result != 'failure'` rather than `== 'success'`: the spacer is
    # intentionally skipped in partial rounds (e.g. a dispatch that includes
    # 4.0 but not 3.3) and a skipped spacer must not swallow this line. A
    # spacer FAILURE (runner/infra blip) does skip the publish — spacing is
    # the point, so we refuse to publish back-to-back after a hiccup; the next
    # line's chain self-heals since it only needs this one to not have failed.
    if: ${{ !cancelled() && needs.resolve-lines.outputs.line-4-0 == 'true' && needs.check-4-0.result == 'success' && needs.check-4-0.outputs.exists == 'false' && needs.space-4-0.result != 'failure' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-4.0
      package-file: dnr-rulesets.tgz
      tag: stable-4.0
      environment: ''
    permissions:
      contents: read
      id-token: write

  space-4-1:
    name: Wait before 4.1 publish
    needs: [resolve-lines, publish-4-0]
    if: ${{ needs.resolve-lines.outputs.line-4-1 == 'true' && needs.publish-4-0.result != 'skipped' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 15
    steps:
      - name: Wait
        shell: bash
        run: sleep 420

  check-4-1:
    name: Check 4.1 version not on npm yet
    needs: [resolve-lines, build-stable-dnr-rulesets]
    if: ${{ needs.resolve-lines.result == 'success' && needs.resolve-lines.outputs.line-4-1 == 'true' && !cancelled() }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Download built package
        uses: actions/download-artifact@v7
        with:
          name: dnr-rulesets-4.1
          path: artifact

      - name: Check target version on npm
        id: version-check
        shell: bash
        run: |
          set -euo pipefail
          TGZ=artifact/dnr-rulesets.tgz
          VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          HTTP=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "https://registry.npmjs.org/@adguard/dnr-rulesets/${VERSION}" 2>/dev/null) || HTTP=000
          case "$HTTP" in
            200)
              echo "::warning::Version ${VERSION} already exists on npm; skipping this publish (likely a previous attempt landed)"
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              if [ "$HTTP" != "404" ]; then
                echo "::warning::npm version check returned ${HTTP} for ${VERSION}; assuming not published and proceeding"
              fi
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  publish-4-1:
    name: Publish DNR rulesets 4.1
    needs: [resolve-lines, build-stable-dnr-rulesets, check-4-1, space-4-1]
