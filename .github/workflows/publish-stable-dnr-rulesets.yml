  #   * No overlap with the primary chain. retry-5-0 waits for publish-4-2
  #     (the last primary), and every later retry waits for the previous
  #     retry-publish, so this whole phase runs strictly after the primary
  #     chain and strictly serialized — a retry can never share a throttle
  #     window with a primary (or another retry) publish.
  #   * Long backoff. Each retry sleeps 10 minutes first. During a real 429
  #     loss the registry had ~half an hour to recover by the time the phase
  #     starts (primary chain length), and the sleep keeps consecutive retry
  #     publishes ~12 minutes apart.
