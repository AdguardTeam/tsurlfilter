name: Publish stable DNR rulesets

# Twice daily (00:17/12:17, ahead of the 00:30/12:30 extension auto-build),
# build and publish @adguard/dnr-rulesets from each of the
# supported stable/dnr-rulesets-* branches (5.0, 6.0).
# The lines carry incompatible ruleset formats: 6.0 is built with
# @adguard/dnr-converter 2.x (metadata split into `metadata.chunk` rules) and
# 5.0 with 1.x; neither reader loads the other format. So each line has its
# own dist-tag: `latest` stays on LATEST_LINE until consumers migrate, every
# other line publishes under `stable-<line>` (6.0 under `stable-6.0`).
# 5.0 introduced the switch to the standalone @adguard/dnr-converter,
# replacing @adguard/tsurlfilter's DNR APIs; older lines are not published.
#
# Each line is built and published by _publish-stable-dnr-rulesets-line.yml:
# the tarball goes to the internal Artifact Keeper (AK) npm registry (shared
# deploy-to-ak-npm.yml workflow), which the extension auto-build installs
# rulesets from. The npm leg is disabled (AG-58867, npm 429) — see the note
# in that workflow.
# resolve-lines skips a line whose branch isn't on the current CI yet.

on:
  schedule:
    # The extension auto-build (00:30/12:30) only picks up the package every
    # 12 h; :17 publishes every line just before it.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      line:
        description: 'Stable line to publish (5.0 or 6.0); empty = all lines'
        required: false
        type: string

# Serialize runs so two rounds never publish colliding timestamped versions.
concurrency:
  group: publish-stable-dnr-rulesets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-lines:
    name: Resolve lines for this round
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      # {"include":[{"line":"5.0","tag":"latest"},...]}: one entry per line
      # whose branch is on the current CI.
      matrix: ${{ steps.lines.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute lines to publish
        id: lines
        shell: bash
        env:
          REQUESTED_LINE: ${{ inputs.line || '' }}
        run: |
          set -euo pipefail

          # Single source of truth for the published stable lines — the
          # check-package-lists.mjs drift guard asserts this assignment.
          ALL_LINES="5.0 6.0"
          # The line that owns `latest`. Move it to 6.0 once consumers read
          # the 6.0 format; every other line publishes under stable-<line>.
          LATEST_LINE="5.0"

          if [ -n "$REQUESTED_LINE" ]; then
            case " $ALL_LINES " in
              *" $REQUESTED_LINE "*)
                LINES="$REQUESTED_LINE"
                ;;
              *)
                echo "::error::Unknown stable line '$REQUESTED_LINE'; expected one of: $ALL_LINES"
                exit 1
                ;;
            esac
          else
            LINES="$ALL_LINES"
          fi

          INCLUDE=""
          for line in $LINES; do
            # Branch is "on the current CI" if these probe files exist at its
            # tip; probed shallowly — no full clone, no gh dep.
            ref="refs/heads/stable/dnr-rulesets-${line}"
            if git fetch -q --depth=1 origin "${ref}" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/inject-package-versions.mjs" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:.github/actions/docker-build/action.yml" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/timeout-wrapper.sh" 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:scripts/ci/copy-test-reports.sh" 2>/dev/null \
              && git show "FETCH_HEAD:Dockerfile" 2>/dev/null | grep -q 'dnr-rulesets-auto-build-output'; then
              if [ "$line" = "$LATEST_LINE" ]; then
                tag="latest"
              else
                tag="stable-${line}"
              fi
              echo "Line ${line}: publish under '${tag}'"
              INCLUDE="${INCLUDE:+${INCLUDE},}{\"line\":\"${line}\",\"tag\":\"${tag}\"}"
            elif [ -n "$REQUESTED_LINE" ]; then
              # An explicit dispatch must not silently publish nothing.
              echo "::error::Line ${line} is not on the current CI (no stable/dnr-rulesets-${line} branch, or it lacks scripts/inject-package-versions.mjs, .github/actions/docker-build, scripts/ci helpers, or the dnr-rulesets-auto-build-output target); backport the CI first"
              exit 1
            else
              echo "Line ${line} is not on the current CI yet; skipping it this round"
            fi
          done

          # A schedule round with no ready line stays green: publish-line is
          # gated on include[0] != null.
          echo "matrix={\"include\":[${INCLUDE}]}" >> "$GITHUB_OUTPUT"

  publish-line:
    name: DNR rulesets ${{ matrix.line }}
    needs: resolve-lines
    if: ${{ needs.resolve-lines.result == 'success' && fromJSON(needs.resolve-lines.outputs.matrix).include[0] != null }}
    strategy:
      # A broken line must not cancel the healthy one.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-lines.outputs.matrix) }}
    uses: ./.github/workflows/_publish-stable-dnr-rulesets-line.yml
    with:
      line: ${{ matrix.line }}
      tag: ${{ matrix.tag }}
    # The AK publish inside needs ARTIFACT_KEEPER_API_KEY, which the shared
    # deploy-to-ak-npm.yml only receives through `secrets: inherit` (see the
    # publish-ak job there).
    secrets: inherit
    # id-token: write is for the (disabled) npm OIDC publish: a called
    # workflow cannot raise the caller's permissions.
    permissions:
      contents: read
      id-token: write

  notify-failure:
    name: Notify on failure
    needs: [resolve-lines, publish-line]
    if: ${{ failure() }}
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':x: *publish-stable-dnr-rulesets* failed — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>'
          color: danger
