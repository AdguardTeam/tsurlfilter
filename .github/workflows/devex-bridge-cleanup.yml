name: DevEx bridge cleanup

# Fires when a source PR in ext-tsurlfilter is closed (merged or abandoned) and
# deletes the AK dev versions devex-bridge.yml published for it — this is the
# required AK cleanup. Nothing else exists to undo: the extension-side PR is
# developer-owned, and its package.json/pnpm-lock.yaml pins simply stop
# resolving once the dev versions are gone (docs require --remove before such
# a PR could merge).
#
# Fail-loud by design: a query failure or an unpublish failure fails the job so
# a broken cleanup is noticed. If AK policy ever forbids unpublish, fix the
# policy (or switch to the AK admin API) rather than silencing this. The
# registry error taxonomy (404 vs 405 vs other) lives in
# scripts/ci/ak-dev-unpublish.sh, shared with devex-bridge.yml, so the two
# twins cannot drift.
#
# Requires the org variable ARTIFACT_KEEPER_URL (base URL of the Artifact
# Keeper instance) and the org secret ARTIFACT_KEEPER_API_KEY — the same
# variable/secret pair devex-bridge.yml and the shared deploy-to-ak-npm.yml
# use. Without ARTIFACT_KEEPER_URL configured, AK_REGISTRY resolves to an empty
# string and every npm call fails loudly, which is the intended behavior.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  BRIDGED_PACKAGES: 'logger css-tokenizer agtree tsurlfilter dnr-rulesets tswebextension'
  VERSION_SUFFIX: 'pr${{ github.event.pull_request.number }}'
  AK_REGISTRY: ${{ vars.ARTIFACT_KEEPER_URL }}/npm/npm-internal

jobs:
  cleanup:
    name: Delete AK dev versions for this PR
    # Fork PRs never produced dev versions; skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout at PR head ref
        # The `closed` event's merge ref (refs/pull/N/merge) is deleted when the
        # PR closes, so check out the PR head ref, which GitHub retains for the
        # PR's lifetime — this is what makes scripts/ci/ak-dev-unpublish.sh
        # (reviewed under CODEOWNERS) available to run the cleanup.
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head

      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      - name: Delete AK dev versions for this PR
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUFFIX: '-dev.${{ env.VERSION_SUFFIX }}'
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          # The `closed` payload normally carries the PR number, but GitHub docs
          # warn it can be incomplete for some merged-PR deliveries. There is no
          # way to reconstruct which versions to delete without it — fail loudly
          # instead of silently cleaning nothing.
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number missing/invalid in the closed event ('${PR_NUMBER}') — cannot compute the -dev.pr suffix"
            exit 1
          fi
          failures=0
          for pkg in ${BRIDGED_PACKAGES}; do
            name="@adguard/${pkg}"
            if ! bash scripts/ci/ak-dev-unpublish.sh "${name}" "${AK_REGISTRY}" "${SUFFIX}"; then
              echo "::error::Cleanup of ${name} failed"
              failures=$((failures + 1))
            fi
          done
          if [ "${failures}" -gt 0 ]; then
            exit 1
          fi

  notify-failure:
    name: Notify cleanup failure
    needs: [cleanup]
    # Cleanup is the single-fire guard against permanent AK orphans; a failure
    # here would otherwise only be visible as a red run on an already-closed PR
    # that nobody watches.
    if: failure()
    runs-on: team-extensions
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Send Slack notification
        uses: AdGuardSoftwareLimited/actions/actions/slack@master
        with:
          channel: '#adguard-extension-vcs'
          message: ':x: *devex-bridge-cleanup* failed for PR #${{ github.event.pull_request.number }} — AK may still hold orphaned dev builds. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>'
          color: danger
