name: DevEx bridge cleanup

# Fires when a source PR in ext-tsurlfilter is closed (merged or abandoned) and
# deletes the AK dev versions devex-bridge.yml published for it — this is the
# required AK cleanup. Nothing else exists to undo: the extension-side PR is
# developer-owned, and its package.json/pnpm-lock.yaml pins simply stop
# resolving once the dev versions are gone (docs require --remove before such
# a PR could merge).
#
# Fail-loud by design: a query failure or an unpublish failure fails the job so
# a broken cleanup is noticed. If AK policy ever forbids unpublish, fix the
# policy (or switch to the AK admin API) rather than silencing this.
#
# Requires the org variable ARTIFACT_KEEPER_URL (base URL of the Artifact
# Keeper instance) and the org secret ARTIFACT_KEEPER_API_KEY — the same
# variable/secret pair devex-bridge.yml and the shared deploy-to-ak-npm.yml
# use. Without ARTIFACT_KEEPER_URL configured, AK_REGISTRY resolves to an empty
# string and every npm call fails loudly, which is the intended behavior.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  BRIDGED_PACKAGES: 'logger css-tokenizer agtree tsurlfilter dnr-rulesets tswebextension'
  AK_REGISTRY: ${{ vars.ARTIFACT_KEEPER_URL }}/npm/npm-internal

jobs:
  cleanup:
    name: Delete AK dev versions for this PR
    # Fork PRs never produced dev versions; skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: team-extensions
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up Node.js for AK registry access
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: ${{ env.AK_REGISTRY }}

      - name: Delete AK dev versions for this PR
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ARTIFACT_KEEPER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUFFIX: '-dev.pr${{ github.event.pull_request.number }}'
        run: |
          set -euo pipefail
          echo "::add-mask::${NODE_AUTH_TOKEN}"
          # The `closed` payload normally carries the PR number, but GitHub docs
          # warn it can be incomplete for some merged-PR deliveries. There is no
          # way to reconstruct which versions to delete without it — fail loudly
          # instead of silently cleaning nothing.
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::PR number missing/invalid in the closed event ('${PR_NUMBER}') — cannot compute the -dev.pr suffix"
            exit 1
          fi
          failures=0
          for pkg in ${BRIDGED_PACKAGES}; do
            name="@adguard/${pkg}"
            # Query failures must not masquerade as "no dev versions": swallowing
            # an auth/transport failure would leave AK litter with a green job —
            # the exact opposite of the fail-loud header. Only E404 is empty.
            if ! raw="$(npm view "${name}" versions --json --registry="${AK_REGISTRY}" --silent 2>&1)"; then
              if grep -qiE '404|not found|E404' <<<"${raw}"; then
                echo "${name}: not present on AK — nothing to clean up"
                continue
              fi
              echo "::error::Could not query ${name} on AK:"
              printf '%s\n' "${raw}"
              exit 1
            fi
            to_delete="$(node -e "
              const raw = JSON.parse(process.argv[1]);
              const list = Array.isArray(raw) ? raw : [raw];
              // endsWith: '-dev.pr1' must not match '-dev.pr12'.
              process.stdout.write(list.filter((v) => v.endsWith(process.env.SUFFIX)).join('\n'));
            " "${raw}")"
            if [ -z "${to_delete}" ]; then
              echo "${name}: no dev versions for this PR"
              continue
            fi
            while IFS= read -r version; do
              [ -n "${version}" ] || continue
              echo "Deleting ${name}@${version}"
              # --force is required: a single-version package on AK carries BOTH
              # the devex and the latest dist-tags, and npm refuses to delete a
              # version that still holds the latest tag (same rationale as the
              # bridge's unpublish step).
              if out="$(npm unpublish "${name}@${version}" --force --registry="${AK_REGISTRY}" 2>&1)"; then
                echo "Deleted ${name}@${version}"
              elif grep -qiE '404|not found|E404|EUNPUBLISH' <<<"${out}"; then
                echo "${name}@${version}: already absent — nothing to delete"
              else
                echo "::error::Could not unpublish ${name}@${version}:"
                printf '%s\n' "${out}"
                failures=$((failures + 1))
              fi
            done <<< "${to_delete}"
          done
          if [ "${failures}" -gt 0 ]; then
            echo "::error::${failures} dev version(s) could not be unpublished — AK still holds them"
            exit 1
          fi
