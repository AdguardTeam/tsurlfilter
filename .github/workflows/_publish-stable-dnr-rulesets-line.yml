name: Publish stable DNR rulesets line

# Builds @adguard/dnr-rulesets from one stable/dnr-rulesets-<line> branch and
# publishes the tarball under the given dist-tag. Called once per line by
# publish-stable-dnr-rulesets.yml, which owns the schedule, the list of lines,
# the dist-tag of each line, the npm publish flag, the concurrency group and
# the Slack alert.
#
# Each line gets its own artifact (dnr-rulesets-<line>) and BuildKit cache
# suffix (-<line>), and its jobs gate only on its own build, so a broken line
# fails alone.
#
# npm leg — WEEKLY, `latest` line only (AG-59859). npm lifted the registry-side
# throttle on 2026-11-19 and asked us to publish less often, so the caller
# sets publish_npm=true only on the Monday round of the line that owns
# `latest`; every other line stays Artifact-Keeper-only (its npm tag never
# existed, so nothing can depend on it). The cadence is a metadata budget, not
# a freshness knob: the packument is ~79 MB of the registry's 100 MB limit
# (22 000+ versions at ~4 KB each) and only grows, while the extension
# auto-build reads AK daily anyway. There is no automatic retry — a retry
# spends more of the throttle window and re-uploads a ~70 MB tarball, so a
# failed publish waits for the next weekly round. scripts/ci/check-npm-version.sh
# fails closed: a 429/5xx/timeout on the idempotency check skips the publish
# instead of pushing blindly. History: AG-58865/AG-58867 (429, leg disabled),
# AG-60418 (re-enable attempt with the retry pass).

on:
  workflow_call:
    inputs:
      line:
        description: 'Stable line (e.g. 6.0): builds stable/dnr-rulesets-<line> and stamps <line>.<UTC timestamp>'
        type: string
        required: true
      tag:
        description: 'Dist-tag to publish under (e.g. latest, stable-6.0)'
        type: string
        required: true
      publish_npm:
        description: 'Publish this build to the public npm registry under `tag`. The caller sets it for the weekly round of the `latest` line only.'
        type: boolean
        required: false
        default: false

# No `concurrency` block on purpose: the caller's group serializes rounds.

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: team-extensions
    timeout-minutes: 30
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable/dnr-rulesets-${{ inputs.line }}
          # Shallow: .git is dockerignored and the stamp comes from changelogs,
          # not git history.
          fetch-depth: 1

      - name: Stamp stable version
        shell: bash
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d%H%M%S)
          STABLE_VERSION="${LINE}.${TS}"
          echo "Stable version: ${STABLE_VERSION}"
          node scripts/inject-package-versions.mjs \
            --package dnr-rulesets \
            --version "${STABLE_VERSION}"

      - name: Build package
        uses: ./.github/actions/docker-build
        with:
          target: dnr-rulesets-auto-build-output
          dest: build-output
          cache-suffix: -${{ inputs.line }}

      - name: Verify package version
        shell: bash
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          TGZ=build-output/artifacts/dnr-rulesets.tgz
          PACKED_VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Escape the dot so a tampered "6x0.20261002120000" can't match.
          LINE_RE="${LINE//./\\.}"
          [[ "$PACKED_VERSION" =~ ^${LINE_RE}\.[0-9]{14}$ ]] || { echo "::error::$TGZ has unexpected stable version $PACKED_VERSION"; exit 1; }

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: dnr-rulesets-${{ inputs.line }}
          path: build-output/artifacts/dnr-rulesets.tgz
          # Publish jobs in the same run only; 1-day retention is plenty.
          retention-days: 1
          if-no-files-found: error

  publish-ak:
    name: Publish to Artifact Keeper
    needs: build
    # If the build fails, the artifact this job needs was never uploaded, so
    # don't start and fail redundantly on top of the primary failure.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-ak-npm.yml@master
    with:
      team: extensions
      artifact-name: dnr-rulesets-${{ inputs.line }}
      tag: ${{ inputs.tag }}
      environment: ''
    # The shared deploy-to-ak-npm.yml reads `secrets.ARTIFACT_KEEPER_API_KEY`
    # but does not declare it in `on.workflow_call.secrets` — GitHub fails any
    # call that passes a secret the called workflow does not declare (startup
    # failure). `secrets: inherit` is required here (the caller inherits too);
    # it is the pattern used by every other consumer (ext-userscripts-wrapper,
    # ext-content-script, ...), and the AK workflow is our own trusted shared
    # workflow. ARTIFACT_KEEPER_URL is an org variable and needs no forwarding.
    secrets: inherit
    permissions:
      contents: read

  # The npm leg runs only when the caller asks for it (weekly Monday round of
  # the `latest` line, or an explicit dispatch) — see the header.
  check-npm:
    name: Check version not on npm yet
    needs: build
    if: ${{ inputs.publish_npm && !cancelled() && needs.build.result == 'success' }}
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Checkout version-check script
        # Sparse: the check only needs scripts/ci (the full clone is huge).
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: dnr-rulesets-${{ inputs.line }}
          path: artifact

      - name: Check target version not on npm yet
        id: version-check
        shell: bash
        run: bash scripts/ci/check-npm-version.sh artifact/dnr-rulesets.tgz

  # A failed or inconclusive version check (429/5xx/timeout) skips the publish:
  # the script exits non-zero instead of publishing blindly.
  publish-npm:
    name: Publish to npm
    needs: [build, check-npm]
    if: ${{ inputs.publish_npm && !cancelled() && needs.check-npm.result == 'success' && needs.check-npm.outputs.exists == 'false' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-${{ inputs.line }}
      package-file: dnr-rulesets.tgz
      tag: ${{ inputs.tag }}
      # Unattended: this environment has no required reviewers, only a
      # deployment-branch restriction to master. Without it npm accepts a
      # publish from any branch, so a dispatch from a branch could put that
      # build on `latest` — see DEPLOYMENT.md ("GitHub Environment").
      environment: npm-stable-dnr-rulesets
    permissions:
      contents: read
      id-token: write
