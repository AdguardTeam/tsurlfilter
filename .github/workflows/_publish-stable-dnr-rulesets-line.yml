name: Publish stable DNR rulesets line

# Builds @adguard/dnr-rulesets from one stable/dnr-rulesets-<line> branch and
# publishes the tarball under the given dist-tag. Called once per line by
# publish-stable-dnr-rulesets.yml, which owns the schedule, the list of lines,
# the dist-tag of each line, the concurrency group and the Slack alert.
#
# Each line gets its own artifact (dnr-rulesets-<line>) and BuildKit cache
# suffix (-<line>), and its jobs gate only on its own build, so a broken line
# fails alone.
#
# npm leg — DISABLED (AG-58867): npm throttles the shared GitHub egress IP
# (HTTP 429), so the npm publish is disabled (publish-npm / retry-publish-npm).
# At npm support's request the npm version checks (check-npm / retry-npm) are
# disabled too, so no npm request is made at all. Building and the Artifact
# Keeper publish (publish-ak) keep running. Publishing moves off
# registry.npmjs.org per AG-59859. To re-enable, drop `if: false` and restore
# the commented conditions on all four npm jobs together. One round then makes
# one npm publish per line; if the throttle budget turns out to be a single
# publish, serialize the lines with `max-parallel: 1` in the caller.

on:
  workflow_call:
    inputs:
      line:
        description: 'Stable line (e.g. 6.0): builds stable/dnr-rulesets-<line> and stamps <line>.<UTC timestamp>'
        type: string
        required: true
      tag:
        description: 'Dist-tag to publish under (e.g. latest, stable-6.0)'
        type: string
        required: true

# No `concurrency` block on purpose: the caller's group serializes rounds.

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: team-extensions
    timeout-minutes: 30
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable/dnr-rulesets-${{ inputs.line }}
          # Shallow: .git is dockerignored and the stamp comes from changelogs,
          # not git history.
          fetch-depth: 1

      - name: Stamp stable version
        shell: bash
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%d%H%M%S)
          STABLE_VERSION="${LINE}.${TS}"
          echo "Stable version: ${STABLE_VERSION}"
          node scripts/inject-package-versions.mjs \
            --package dnr-rulesets \
            --version "${STABLE_VERSION}"

      - name: Build package
        uses: ./.github/actions/docker-build
        with:
          target: dnr-rulesets-auto-build-output
          dest: build-output
          cache-suffix: -${{ inputs.line }}

      - name: Verify package version
        shell: bash
        env:
          LINE: ${{ inputs.line }}
        run: |
          set -euo pipefail
          TGZ=build-output/artifacts/dnr-rulesets.tgz
          PACKED_VERSION=$(tar -xOf "$TGZ" package/package.json | node -e "let json = ''; process.stdin.on('data', (data) => json += data).on('end', () => process.stdout.write(JSON.parse(json).version))")
          # Escape the dot so a tampered "6x0.20261002120000" can't match.
          LINE_RE="${LINE//./\\.}"
          [[ "$PACKED_VERSION" =~ ^${LINE_RE}\.[0-9]{14}$ ]] || { echo "::error::$TGZ has unexpected stable version $PACKED_VERSION"; exit 1; }

      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: dnr-rulesets-${{ inputs.line }}
          path: build-output/artifacts/dnr-rulesets.tgz
          # Publish/retry jobs in the same run only; 1-day retention is plenty.
          retention-days: 1
          if-no-files-found: error

  publish-ak:
    name: Publish to Artifact Keeper
    needs: build
    # If the build fails, the artifact this job needs was never uploaded, so
    # don't start and fail redundantly on top of the primary failure.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-ak-npm.yml@master
    with:
      team: extensions
      artifact-name: dnr-rulesets-${{ inputs.line }}
      tag: ${{ inputs.tag }}
      environment: ''
    # The shared deploy-to-ak-npm.yml reads `secrets.ARTIFACT_KEEPER_API_KEY`
    # but does not declare it in `on.workflow_call.secrets` — GitHub fails any
    # call that passes a secret the called workflow does not declare (startup
    # failure). `secrets: inherit` is required here (the caller inherits too);
    # it is the pattern used by every other consumer (ext-userscripts-wrapper,
    # ext-content-script, ...), and the AK workflow is our own trusted shared
    # workflow. ARTIFACT_KEEPER_URL is an org variable and needs no forwarding.
    secrets: inherit
    permissions:
      contents: read

  # DISABLED (AG-58867): see the npm leg note in the header.
  check-npm:
    name: Check version not on npm yet
    needs: build
    # if: ${{ !cancelled() && needs.build.result == 'success' }}
    if: false
    runs-on: team-extensions
    timeout-minutes: 10
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Checkout version-check script
        # Sparse: the check only needs scripts/ci (the full clone is huge).
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: dnr-rulesets-${{ inputs.line }}
          path: artifact

      - name: Check target version not on npm yet
        id: version-check
        shell: bash
        run: bash scripts/ci/check-npm-version.sh artifact/dnr-rulesets.tgz

  # DISABLED (AG-58867): see the npm leg note in the header.
  publish-npm:
    name: Publish to npm
    needs: [build, check-npm]
    # if: ${{ !cancelled() && needs.check-npm.result == 'success' && needs.check-npm.outputs.exists == 'false' }}
    if: false
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-${{ inputs.line }}
      package-file: dnr-rulesets.tgz
      # No environment so unattended runs don't wait on approval.
      tag: ${{ inputs.tag }}
      environment: ''
    permissions:
      contents: read
      id-token: write

  # DISABLED (AG-58867): part of the npm leg — it re-checks npm after the
  # backoff, so it is disabled with the rest.
  retry-npm:
    name: Retry npm
    needs: [build, publish-npm]
    # if: ${{ !cancelled() && needs.publish-npm.result == 'failure' }}
    if: false
    runs-on: team-extensions
    timeout-minutes: 20
    outputs:
      exists: ${{ steps.version-check.outputs.exists }}
    steps:
      - name: Back off
        # Outlast the npm throttle window; npm's own retry (~70s) doesn't.
        shell: bash
        run: sleep 600

      - name: Checkout version-check script
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          fetch-depth: 1

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: dnr-rulesets-${{ inputs.line }}
          path: artifact

      - name: Re-check target version on npm
        id: version-check
        shell: bash
        run: bash scripts/ci/check-npm-version.sh artifact/dnr-rulesets.tgz

  # DISABLED (AG-58867): same as publish-npm, do not upload to npm.
  retry-publish-npm:
    name: Publish to npm (retry)
    needs: [retry-npm]
    # if: ${{ !cancelled() && needs.retry-npm.result == 'success' && needs.retry-npm.outputs.exists == 'false' }}
    if: false
    uses: AdGuardSoftwareLimited/actions/.github/workflows/deploy-to-npm.yml@master
    with:
      artifact-name: dnr-rulesets-${{ inputs.line }}
      package-file: dnr-rulesets.tgz
      tag: ${{ inputs.tag }}
      environment: ''
    permissions:
      contents: read
      id-token: write
