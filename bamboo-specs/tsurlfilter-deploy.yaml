---
version: 2
deployment:
  name: tsurlfilter - deploy
  source-plan: AJL-TSURLFILTERBUILD
release-naming: ${bamboo.inject.version}
# Here we need fully identical environments in order
# to have different major versions in bamboo releases
environments:
  - npmjs • 5.x
  - npmjs • 6.x
  - npmjs • alpha
  - npmjs • beta

npmjs • 5.x: &npmjs
  variables: &npmjs-variables
    publishArgs: --access public
  docker: &npmjs-docker
    image: adguard/node-ssh:22.22--0
    volumes:
      ${system.PNPM_DIR}: ${bamboo.cachePnpm}
  triggers: []
  tasks:
    - checkout:
        force-clean-build: true
    - artifact-download:
        artifacts:
          - name: tsurlfilter.tgz
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -e
            set -x

            # Fix mixed logs
            exec 2>&1

            ls -alt

            export NPM_TOKEN=${bamboo.npmSecretToken}
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            npm publish tsurlfilter.tgz $bamboo_publishArgs
  requirements:
    - extension: 'true'

npmjs • 6.x:
  <<: *npmjs

npmjs • alpha:
  <<: *npmjs
  variables:
    <<: *npmjs-variables
    publishArgs: --tag alpha --access public

npmjs • beta:
  <<: *npmjs
  variables:
    <<: *npmjs-variables
    publishArgs: --tag beta --access public
